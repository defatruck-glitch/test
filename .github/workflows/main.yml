
name: Build Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config cmake build-essential \
            libffi-dev libssl-dev \
            libltdl-dev zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.34"

      
      - name: Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          (while true; do echo y; sleep 1; done) | buildozer -v android debug


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-android-apk
          path: bin/*.apk
          if-no-files-found: error
